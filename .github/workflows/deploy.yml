# CI/CD — build estático do Astro + deploy no Hostinger via FTPS.
#
# Gate de qualidade (astro check + lint) roda ANTES do build; se qualquer um
# falhar, o deploy é bloqueado (ver docs/adr/0001-migracao-astro-php-hostinger.md).
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    host FTP do Hostinger (hPanel → Files → FTP Accounts)
#   FTP_USERNAME  usuário FTP
#   FTP_PASSWORD  senha FTP
#
# O `server-dir` é ./ porque a conta FTP é dedicada a este site (chroot direto na
# pasta pública do domínio) — ver comentário no passo de deploy.

name: CI/CD — Deploy Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- Gate de qualidade (bloqueia o deploy se falhar) ----
      - name: Type-check (astro check)
        run: pnpm check

      - name: Lint (eslint)
        run: pnpm lint

      # ---- Build ----
      - name: Build (gera dist/)
        run: pnpm build

      # ---- Deploy (somente em push na main; PRs param no gate/build) ----
      - name: Deploy via FTPS
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # A conta FTP é dedicada a este site (chroot em
          # domains/maria-dinoir-terapeuta.com/public_html), então ./ já é a raiz servida.
          server-dir: ./
