# CI/CD — build estático do Astro + deploy no Hostinger via FTPS.
#
# Gate de qualidade (astro check + lint) roda ANTES do build; se qualquer um
# falhar, o deploy é bloqueado (ver docs/adr/0001-migracao-astro-php-hostinger.md).
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    host FTP do Hostinger (hPanel → Files → FTP Accounts)
#   FTP_USERNAME  usuário FTP
#   FTP_PASSWORD  senha FTP
#
# O `server-dir` aponta para a raiz servida do domínio. Aqui é um domínio addon,
# então o caminho é domains/<dominio>/public_html/ (ver comentário no passo de deploy).

name: CI/CD — Deploy Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- Gate de qualidade (bloqueia o deploy se falhar) ----
      - name: Type-check (astro check)
        run: pnpm check

      - name: Lint (eslint)
        run: pnpm lint

      # ---- Build ----
      - name: Build (gera dist/)
        run: pnpm build

      # ---- Deploy (somente em push na main; PRs param no gate/build) ----
      - name: Deploy via FTPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Este é um domínio addon: o login FTP cai no home (~/), e o site é
          # servido de domains/<dominio>/public_html/ (NÃO no ~/public_html/, que
          # tem um arquivo DO_NOT_UPLOAD_HERE). Por isso o caminho completo abaixo.
          server-dir: ./domains/maria-dinoir-terapeuta.com/public_html/
          # Primeiro deploy: zera public_html/ antes de subir, para uma troca limpa
          # do site estático antigo (remove arquivos órfãos).
          # ⚠️ REMOVA esta linha após o primeiro deploy bem-sucedido — do contrário
          # todo deploy futuro apagará TUDO em public_html/ antes de subir (incluindo
          # o backend PHP quando ele existir).
          dangerous-clean-slate: true
